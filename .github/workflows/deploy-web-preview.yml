name: Deploy Mafahim web studio
on:
  push:
    branches: [main]
    paths:
      - 'web-preview/**'
      - '.github/workflows/deploy-web-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web-preview/**'
      - '.github/workflows/deploy-web-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate HTML and inline JavaScript
        run: python web-preview/tests/validate.py
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node web-preview/tests/smoke.cjs
  deploy:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload web studio
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
