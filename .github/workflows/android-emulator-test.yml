name: Android emulator UI validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-test.yml'
      - 'app/**'
      - '*.gradle.kts'
  pull_request:
    paths:
      - '.github/workflows/android-emulator-test.yml'
      - 'app/**'
      - '*.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    # Pin the known-stable hosted image; ubuntu-latest can move to a new
    # runner image with emulator/KVM regressions independently of app code.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'platform-tools' 'system-images;android-34;google_apis;x86_64'

      - name: Run UI smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
