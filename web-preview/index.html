<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11101b"><title>مفاهيم — استوديو الرسم الإبداعي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#11101b;--panel:#1b1928;--panel2:#242137;--line:#343047;--muted:#a6a0b8;--text:#f7f4ff;--violet:#a78bfa;--pink:#f0abfc;--cyan:#67e8f9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#30234a 0,transparent 35%),var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:1px solid var(--line);background:#242137;border-radius:12px;padding:9px 13px;cursor:pointer;transition:.18s}button:hover{border-color:var(--violet);background:#302a48}button.active{background:linear-gradient(135deg,#7654cf,#a35ab8);border-color:transparent;box-shadow:0 5px 18px #8b5cf633}
.app{max-width:1500px;margin:auto;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:100vh}.top{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#1b1928eF;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 36px #0003}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(140deg,#8b5cf6,#ec4899);display:grid;place-items:center;box-shadow:0 8px 24px #a855f755}.logo svg{width:30px}.brand{flex:1}.brand strong{display:block;font-size:19px}.brand small{color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions button{font-size:13px}
.workspace{display:grid;grid-template-columns:74px minmax(0,1fr) 245px;gap:14px;flex:1;min-height:620px}.rail,.inspector{background:#1b1928eF;border:1px solid var(--line);border-radius:18px;padding:12px}.rail{display:flex;flex-direction:column;gap:9px;align-items:center}.tool{width:48px;height:48px;padding:0;font-size:20px;display:grid;place-items:center}.tool small{font-size:9px}.stage{background:#191724;border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;min-width:0}.stagebar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.stagebar span:first-child{color:var(--text);font-weight:600}.stagebar .spacer{flex:1}.canvas-wrap{flex:1;min-height:520px;position:relative;overflow:hidden;background-color:#171522;background-image:radial-gradient(#514b65 1px,transparent 1px);background-size:22px 22px;display:grid;place-items:center;padding:26px}.paper{width:min(100%,900px);height:min(100%,700px);min-height:430px;background:#fff;border-radius:3px;box-shadow:0 18px 55px #0008;touch-action:none;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.inspector h3{font-size:14px;margin:4px 0 14px}.section{padding:13px 0;border-top:1px solid var(--line)}.section:first-of-type{border-top:0}.muted{color:var(--muted);font-size:12px}.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}.swatch{width:29px;height:29px;border-radius:50%;padding:0;border:2px solid #ffffff40}.swatch.active{outline:2px solid var(--violet);outline-offset:3px}.range{width:100%;accent-color:var(--violet);margin-top:12px}.layer{display:flex;align-items:center;justify-content:space-between;padding:9px;background:#242137;border:1px solid var(--line);border-radius:10px;font-size:12px;margin-top:8px}.bottom{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding:0 4px}.hint{position:absolute;bottom:12px;right:14px;background:#1b1928dd;color:#cfc8e1;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;pointer-events:none}
@media(max-width:900px){.workspace{grid-template-columns:60px minmax(0,1fr)}.inspector{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.inspector h3{grid-column:1/-1;margin-bottom:0}.section{border-top:0;padding:4px}.canvas-wrap{min-height:480px}.top{flex-wrap:wrap}.top-actions{width:100%}}
@media(max-width:560px){.app{padding:9px;gap:9px}.top{border-radius:15px;padding:10px}.brand small{font-size:10px}.top-actions button{padding:7px 9px;font-size:11px}.workspace{grid-template-columns:48px minmax(0,1fr);gap:8px;min-height:0}.rail{padding:7px 4px;gap:7px}.tool{width:38px;height:40px;font-size:17px}.canvas-wrap{padding:10px;min-height:420px}.paper{min-height:400px}.inspector{grid-template-columns:1fr 1fr;padding:10px}.inspector h3{grid-column:1/-1}.bottom{font-size:10px}}
</style></head>
<body><main class="app">
<header class="top"><div class="logo"><svg viewBox="0 0 48 48" fill="none"><path d="M10 34 24 7l14 27M16 25h16M13 39h22" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="25" r="3" fill="#fff"/></svg></div><div class="brand"><strong>مفاهيم</strong><small>استوديو الرسم الإبداعي · معاينة الويب</small></div><nav class="top-actions"><button id="undo">↶ تراجع</button><button id="redo">↷ إعادة</button><button id="clear">مسح اللوحة</button><button id="export" class="active">تنزيل PNG ⇧</button></nav></header>
<section class="workspace">
<aside class="rail" aria-label="أدوات الرسم">
<button class="tool active" data-tool="pen" title="قلم">✎</button><button class="tool" data-tool="pencil" title="رصاص">⌁</button><button class="tool" data-tool="marker" title="قلم تمييز">▰</button><button class="tool" data-tool="line" title="خط">／</button><button class="tool" data-tool="rect" title="مستطيل">▱</button><button class="tool" data-tool="ellipse" title="دائرة">◯</button><button class="tool" data-tool="eraser" title="ممحاة">⌫</button><button class="tool" data-tool="hand" title="تحريك">✋</button><button class="tool" id="imageBtn" title="إضافة صورة">▧</button><input id="imageInput" type="file" accept="image/*" hidden>
</aside>
<section class="stage"><div class="stagebar"><span>لوحة العمل</span><span>•</span><span>لوحة جديدة</span><div class="spacer"></div><span id="zoomLabel">100%</span><button id="zoomOut">−</button><button id="zoomIn">＋</button></div><div class="canvas-wrap"><div class="paper"><canvas id="board" width="1400" height="1000"></canvas></div><div class="hint">اسحب بإصبعك أو الفأرة للرسم على اللوحة</div></div></section>
<aside class="inspector"><h3>خصائص الأداة</h3><div class="section"><div>اللون</div><div class="muted">اختر لون الرسم</div><div class="colors" id="colors"></div></div><div class="section"><div>سُمك الفرشاة</div><div class="muted"><span id="widthLabel">6</span> px</div><input class="range" id="width" type="range" min="1" max="48" value="6"></div><div class="section"><div>الطبقات</div><div class="layer"><span>◉ الطبقة الأولى</span><span>⋮</span></div><button style="width:100%;margin-top:9px" id="addLayer">＋ إضافة طبقة</button></div><div class="section"><div>الصفحات</div><div class="layer"><span>▧ الصفحة 1</span><span>نشطة</span></div><button style="width:100%;margin-top:9px" id="addPage">＋ صفحة جديدة</button></div></aside>
</section><footer class="bottom"><span>مفاهيم · نموذج ويب تجريبي مستقل</span><span>الرسم محلي داخل المتصفح ولا يُرفع إلى خادم</span></footer>
</main>
<script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');let tool='pen',color='#24212e',width=6,drawing=false,start=null,zoom=100,history=[],redoStack=[],pages=1,layers=1;
const colors=['#24212e','#8b5cf6','#ec4899','#06b6d4','#10b981','#f59e0b','#ef4444','#3b82f6','#111827','#ffffff'];
function snapshot(){history.push(canvas.toDataURL());if(history.length>40)history.shift();redoStack=[]}
function restore(url){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0)};im.src=url}
function setup(){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);snapshot()}setup();
const colorBox=document.getElementById('colors');colors.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c===color?' active':'');b.style.background=c;b.title=c;b.onclick=()=>{color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b))};colorBox.append(b)});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('width').oninput=e=>{width=+e.target.value;document.getElementById('widthLabel').textContent=width};
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('pointerdown',e=>{if(tool==='hand')return;canvas.setPointerCapture(e.pointerId);snapshot();drawing=true;start=pos(e);ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=tool==='eraser'?width*5:width;ctx.strokeStyle=tool==='eraser'?'#fff':color;ctx.globalAlpha=tool==='marker'?.28:1});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);if(['pen','pencil','marker','eraser'].includes(tool)){ctx.lineTo(p.x,p.y);ctx.stroke()}});
function finish(e){if(!drawing)return;drawing=false;const p=pos(e);ctx.globalAlpha=1;if(['line','rect','ellipse'].includes(tool)){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();if(tool==='line'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y)}else if(tool==='rect'){ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y)}else ctx.ellipse((start.x+p.x)/2,(start.y+p.y)/2,Math.abs(p.x-start.x)/2,Math.abs(p.y-start.y)/2,0,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;ctx.beginPath()}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
document.getElementById('undo').onclick=()=>{if(history.length>1){redoStack.push(canvas.toDataURL());history.pop();restore(history[history.length-1])}};
document.getElementById('redo').onclick=()=>{if(redoStack.length){const s=redoStack.pop();history.push(s);restore(s)}};
document.getElementById('clear').onclick=()=>{snapshot();ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)};
document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.download='mafahim-board.png';a.href=canvas.toDataURL('image/png');a.click()};
document.getElementById('zoomIn').onclick=()=>setZoom(zoom+10);document.getElementById('zoomOut').onclick=()=>setZoom(zoom-10);function setZoom(v){zoom=Math.max(50,Math.min(160,v));document.getElementById('zoomLabel').textContent=zoom+'%';document.querySelector('.paper').style.transform='scale('+zoom/100+')';document.querySelector('.paper').style.transformOrigin='center center'}
document.getElementById('addLayer').onclick=()=>{layers++;const x=document.createElement('div');x.className='layer';x.innerHTML='<span>◉ الطبقة '+(layers===2?'الثانية':layers)+'</span><span>⋮</span>';document.querySelectorAll('.section')[2].insertBefore(x,document.getElementById('addLayer'))};
document.getElementById('addPage').onclick=()=>{pages++;const x=document.createElement('div');x.className='layer';x.innerHTML='<span>▧ الصفحة '+pages+'</span><span>نشطة</span>';document.querySelectorAll('.section')[3].insertBefore(x,document.getElementById('addPage'))};
document.getElementById('imageBtn').onclick=()=>document.getElementById('imageInput').click();document.getElementById('imageInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{snapshot();const scale=Math.min(700/im.width,600/im.height,1);ctx.drawImage(im,80,80,im.width*scale,im.height*scale);URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};
</script></body></html>
